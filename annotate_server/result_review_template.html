<body>
<header class="app-header"><div class="brand"><div class="mark" aria-hidden="true">R</div><div><h1>RAG review studio</h1><p class="muted">Evidence, decisions, and a clearer view of every conversation.</p></div></div><span class="live-indicator">● Autosave enabled</span></header>
<main>
<div class="review-bar"><span id="review-status" class="review-status" role="status" aria-live="polite"></span><a id="review-link"></a></div>
<div class="filters">
<label>Method <select id="method"><option value="">All methods</option><option>Vector</option><option>HippoRag</option><option>Raptor</option><option>SelfRAG</option></select></label>
<label>Queue <select id="scope"><option value="first">Next incorrect per conversation</option><option value="annotated">All annotated turns</option><option value="everything">Review targets + annotated turns</option></select></label>
<label>Decisions <select id="coverage"><option value="any">Any coverage</option><option value="none">No decisions yet</option><option value="partial">Needs more reviewers</option><option value="all">All 3 annotators</option></select></label>
<label><span class="sr">Search conversations</span><input id="search" type="search" placeholder="Find question or conversation"></label>
<nav class="navigation" aria-label="Turn navigation"><button id="prev" aria-label="Previous incorrect turn">← Previous</button><span id="position" class="muted" aria-live="polite"></span><button id="next" aria-label="Next incorrect turn">Next →</button></nav>
</div>
<div class="progress" aria-hidden="true"><div id="progress"></div></div>
<div class="workspace-grid"><aside class="conversation-rail" aria-label="Conversation queue"><div class="rail-heading"><span class="eyebrow">Conversations</span><span id="queue-count"></span></div><p class="rail-hint">Ordered by conversation, then turn</p><div id="conversation-queue"></div></aside><div class="review-workspace"><div id="queue-summary" class="queue-summary"></div><div id="content"></div></div></div>
<footer class="source-note"><details><summary id="source-summary">Source details</summary><div id="sources"></div></details></footer>
</main>
<dialog id="decision-editor" class="editor" aria-labelledby="edit-title">
<form id="decision-form">
<header><div><h2 id="edit-title">Edit decision</h2><p id="edit-context" class="muted"></p></div><button id="edit-cancel" type="button">Cancel</button></header>
<label class="edit-field">Outcome<select id="edit-outcome"><option value="errors">Error labels</option><option value="not_a_failure">Not a failure</option><option value="outside_taxonomy">Outside taxonomy</option><option value="insufficient_evidence">Insufficient evidence</option><option value="excluded">Excluded</option><option value="clear">Clear failure labels</option></select></label>
<fieldset id="edit-errors"><legend>Failure labels</legend><div id="error-options" class="error-options"></div></fieldset>
<div class="edit-fields"><label class="edit-field">Correctness<select id="edit-correctness"><option value="">Not specified</option><option value="correct">Correct</option><option value="incorrect">Incorrect</option><option value="uncertain">Uncertain</option></select></label><label class="edit-field">Gold answer check<select id="edit-gold"><option value="">Not checked</option><option value="supported">Supported</option><option value="questionable">Questionable</option><option value="incorrect">Incorrect</option></select></label></div>
<label class="edit-field">Notes<textarea id="edit-notes" rows="3"></textarea></label>
<label class="edit-field">Gold notes<textarea id="edit-gold-notes" rows="2"></textarea></label>
<div class="edit-flags"><label><input type="checkbox" id="edit-reviewed">Reviewed</label><label><input type="checkbox" id="edit-flagged">Flag for review</label></div>
<p id="edit-path" class="edit-path"></p><p id="edit-feedback" class="edit-feedback" role="status" aria-live="polite"></p>
<div class="edit-actions"><button id="edit-reload" type="button" hidden>Load latest decision</button><button id="edit-save" type="submit" class="primary">Save decision</button></div>
</form>
</dialog>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('review-data').textContent);
const $=id=>document.getElementById(id);
// Punctuation is normalized for display only. Saved source files stay intact.
const clean=s=>String(s??'').replace(/\u2014/g,', ').replace(/\u00b7/g,',');
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=clean(text);return node;}
const names={not_a_failure:'Not a failure',outside_taxonomy:'Outside taxonomy',insufficient_evidence:'Insufficient evidence',excluded:'Excluded'};
let filtered=[],index=0;
let pendingAdvance=null;
function requestAdvance(row,name,changes){if(changes.failure_types?.length===1&&['not_a_failure','excluded'].includes(changes.failure_types[0])&&filtered[index]?.key===row.key)pendingAdvance={key:row.key,method:row.method,id:row.id,name,turn:row.turn,version:row.annotation_versions[name]};}
let editState=null,saving=false,dirty=false,polling=false,reviewVersion=D.review_version||'';
function isLabelled(a){return !!(a.human_label||a.failure_type||a.failure_types?.length);}

    if(!filtered.some(row=>row.key===target.key)){$('scope').value='first';$('coverage').value='any';$('search').value='';applyFilters();}
    if(oldKey===advance.key){index=filtered.findIndex(row=>row.key===target.key);render();}
    status('Saved. Next incorrect turn for '+advance.name+': '+target.conversation_number+' / Turn '+target.turn+'.');
   }else status('Saved. No more incorrect turns in this conversation for '+advance.name+'.');
  }else status('Live review. Saves go directly to Annotate_result.');
 }catch(error){status('Refresh failed. Keeping the current review. '+error.message,true);}
 finally{polling=false;}
}
$('review-link').href=D.review_api?'/results':'http://127.0.0.1:8766/review';$('review-link').textContent=D.review_api?'Live agreement results':'Open editable review';
status(D.review_api?'Live review. Saves go directly to Annotate_result.':'Offline snapshot. Open editable review to save changes.');renderSources();applyFilters();if(D.review_api)setInterval(refreshReview,3000);
</script>
